chatNotInstalledDescription=RAI Assistant est un assistant d''analyse de données qui fonctionne dans plusieurs environnements — Positron et RStudio. Il se connecte à vos sessions R et Python en cours, voit vos données et vous aide à explorer, visualiser, créer et déboguer.
chatNotInstalledDescription2=RAI Assistant a besoin d''un fournisseur de modèles pour générer ses réponses. Essayez Assistant gratuitement avec Posit AI — un service géré par Posit qui vous donne accès aux LLM de pointe via un compte unique. Il vous suffit de vous connecter et de commencer à discuter.
chatNotInstalledDescriptionWorkbench=RAI Assistant est un agent de chat collaboratif alimenté par le fournisseur de modèles de votre organisation.
chatNotInstalledAdditionalProviders=L''accès direct par API à d''autres fournisseurs (Anthropic, OpenAI, Amazon Bedrock, et autres) est également pris en charge.
